name: food-delivery-system

services:
  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/user_db
      - JWT_SECRET=vit_swe4007_secret_key_2026
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user-service:
    build: ./services/user-service
    container_name: user-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://mongodb:27017/user_db
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  restaurant-service:
    build: ./services/restaurant-service
    restart: unless-stopped
    expose:
      - "5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/restaurant_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-service:
    build: ./services/order-service
    restart: unless-stopped
    expose:
      - "5004"
    environment:
      - PORT=5004
      - MONGO_URI=mongodb://mongodb:27017/order_db
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  payment-service:
    build: ./services/payment-service
    restart: unless-stopped
    expose:
      - "5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://mongodb:27017/payment_db
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  delivery-service:
    build: ./services/delivery-service
    container_name: delivery-service
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - MONGO_URI=mongodb://mongodb:27017/delivery_db
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "5007:5007"
    environment:
      - PORT=5007
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5007/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  review-service:
    build: ./services/review-service
    container_name: review-service
    restart: unless-stopped
    ports:
      - "5008:5008"
    environment:
      - PORT=5008
      - MONGO_URI=mongodb://mongodb:27017/review_db
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5008/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:5001
      USER_SERVICE_URL: http://user-service:5002
      RESTAURANT_SERVICE_URL: http://restaurant-service:5003
      ORDER_SERVICE_URL: http://order-service:5004
      PAYMENT_SERVICE_URL: http://payment-service:5005
      DELIVERY_SERVICE_URL: http://delivery-service:5006
      NOTIFICATION_SERVICE_URL: http://notification-service:5007
      REVIEW_SERVICE_URL: http://review-service:5008
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
    networks:
      - food-delivery-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  food-delivery-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
